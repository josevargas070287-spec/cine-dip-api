name: CI api cine

on:
  push:
  branches: [master]

env:
  IMAGEN: ${{ secrets.DOCKER_USERNAME }}/api-cine:${{ github.sha }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: checkount
        uses: actions/checkout@v4

      - name: inastalar-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      
      - name: instalar-dependencias
        run: npm ci